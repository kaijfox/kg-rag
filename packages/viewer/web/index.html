<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kg viewer</title>
<style>
  :root {
    --bg: #fafaf9;
    --fg: #1c1917;
    --muted: #78716c;
    --line: #e7e5e4;
    --panel: #ffffff;
    --accent: #1d4ed8;
    --error: #b91c1c;
    --mark: #fef3c7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1917;
      --fg: #f5f5f4;
      --muted: #a8a29e;
      --line: #44403c;
      --panel: #292524;
      --accent: #93c5fd;
      --error: #fca5a5;
      --mark: #3f3f1f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1917;
    --fg: #f5f5f4;
    --muted: #a8a29e;
    --line: #44403c;
    --panel: #292524;
    --accent: #93c5fd;
    --error: #fca5a5;
    --mark: #3f3f1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 12px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; }
  #status { color: var(--muted); }
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 260px) minmax(0, 1fr);
    gap: 16px;
    padding: 16px;
  }
  @media (max-width: 720px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
  }
  h2 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  section { min-width: 0; }
  #sessions button {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--panel);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    overflow-wrap: anywhere;
  }
  #sessions button[aria-current="true"] { border-color: var(--accent); }
  #sessions .meta { color: var(--muted); font-size: 12px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 16px;
    min-width: 0;
  }
  #diagram svg { max-width: 100%; height: auto; }
  #states button {
    margin: 0 6px 6px 0;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 8px;
    cursor: pointer;
  }
  #visit pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin: 0;
    font-size: 12px;
    max-height: 260px;
    overflow: auto;
  }
  #timeline .ev {
    border-bottom: 1px solid var(--line);
    padding: 4px 0;
    overflow-wrap: anywhere;
  }
  .seq, .muted { color: var(--muted); }
  .type { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .state { font-family: ui-monospace, Menlo, monospace; color: var(--accent); }
  .error { color: var(--error); font-weight: 600; }
  .cand { white-space: nowrap; }
  .score { color: var(--muted); }
  .item { cursor: pointer; text-decoration: underline dotted; }
  details { display: inline; }
  summary { display: inline; cursor: pointer; color: var(--muted); }
  details[open] > * { display: inline; }
  #item-detail {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 16px;
    max-height: 40vh;
    overflow: auto;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  #notes textarea {
    width: 100%;
    min-height: 60px;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px;
    font: inherit;
  }
  #notes ul { padding-left: 18px; margin: 8px 0 0; }
  #notes li { overflow-wrap: anywhere; margin-bottom: 4px; }
  select { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 4px; max-width: 100%; }
  mark { background: var(--mark); color: inherit; }
</style>
</head>
<body>
<header>
  <h1>kg viewer</h1>
  <span id="status" role="status"></span>
</header>
<main class="layout">
  <aside>
    <h2>Sessions</h2>
    <div id="sessions"></div>
  </aside>
  <section>
    <div class="panel" id="run-panel" hidden>
      <h2>Machine run</h2>
      <label>Run <select id="run"></select></label>
      <div id="diagram"></div>
      <div id="states"></div>
      <div id="visit"></div>
    </div>
    <div class="panel" id="timeline-panel">
      <h2>Timeline</h2>
      <div id="timeline"></div>
    </div>
    <div class="panel" id="notes" hidden>
      <h2>Notes</h2>
      <form id="note-form">
        <textarea id="note-text" aria-label="Note"></textarea>
        <div><button type="submit">Add note</button></div>
      </form>
      <ul id="note-list"></ul>
    </div>
  </section>
</main>
<div id="item-detail" hidden></div>
<script src="/vendor/mermaid.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
