[project]
name = "kg-parse"
version = "0.1.0"
description = "Thin docling wrapper that writes kg parse artifacts (kg-parse-artifact/1)."
requires-python = ">=3.11,<3.14"
dependencies = [
    "docling==2.140.0",
    "pypdfium2==5.14.0",
    "pillow==12.3.0",
    "huggingface-hub==1.33.0",
    "mlx-vlm==0.7.8; sys_platform == 'darwin'",
]

[project.scripts]
kg-parse = "kg_parse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_parse"]

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
